[project]
name = "Calculator for MAI"
authors = [{name = 'spTrent', email = 'artemrazumovvv@gmail.com'}]
version = "1.0.0"
description = "Calculator in reverse polish notation for Laboratory job MAI"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.2",
    "mypy>=1.18.2",
]

[tool.ruff]
line-length = 79
target-version = 'py312'

[tool.ruff.lint]
fixable = ['ALL']
select = ['E', 'F', 'I', 'B']

[tool.mypy]
python_version = '3.12'
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
